<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 12px;
        font: 12px/18px Inter, system-ui, sans-serif;
        color: var(--figma-color-text, #1e1e1e);
        background: var(--figma-color-bg, #fff);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--figma-color-icon-warning, #f5a623);
      }
      .dot[data-state='connected'] {
        background: var(--figma-color-icon-success, #14ae5c);
      }
      .muted {
        color: var(--figma-color-text-secondary, #757575);
      }
    </style>
  </head>
  <body>
    <div class="row"><span id="dot" class="dot"></span><strong id="state">Connecting to relay…</strong></div>
    <div id="file" class="muted"></div>
    <div id="mode" class="muted"></div>
    <div id="last" class="muted"></div>
    <!-- ui-script -->
  </body>
</html>
